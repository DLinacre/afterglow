name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site integrity
        run: |
          echo "Checking required files exist..."
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          test -f assets/banner.png || { echo "::error::banner missing"; exit 1; }
          echo "Validating index.html is non-trivial..."
          bytes=$(wc -c < index.html)
          echo "index.html is $bytes bytes"
          test "$bytes" -gt 1000 || { echo "::error::index.html too small"; exit 1; }
          echo "All checks passed ✓"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
